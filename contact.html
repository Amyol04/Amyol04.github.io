<main>
    <h1>Get In Touch</h1>

    <p>
        Have a question or want to work together?
        I'd love to hear from you! Fill in the form below
        and I'll get back to you as soon as possible.
    </p>

    <div class="form-container">

        <form id="contactForm">

            <label for="name">Your Name</label>
            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                placeholder="Enter your name"
                required
            >

            <label for="email">Your Email</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

            <label for="message">Your Message</label>
            <textarea
                id="message"
                name="message"
                class="form-control"
                placeholder="Write your message here..."
                required
            ></textarea>

            <button
                type="submit"
                class="submitButton"
            >
                Send Message
            </button>

        </form>

    </div>
</main>
